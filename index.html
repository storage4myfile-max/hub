<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VED Investment – Tools</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e2147;--ink:#101c36;--muted:#5b6b85;--line:#d9e1ee;--bg:#f3f6fb;--accent:#13a89a;--tile:#eaf0fa}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.5;
}

/* ---------- compact header ---------- */
header{background:var(--navy);border-bottom:4px solid var(--accent)}
.bar{max-width:1040px;margin:0 auto;padding:22px 28px;display:flex;align-items:center;gap:22px}
.bar .gan{flex:none;height:92px;width:auto;display:block}
.bar h1{margin:0;color:#fff;font-weight:800;font-size:clamp(30px,5.2vw,52px);line-height:1.05;letter-spacing:-.025em}
.bar p{margin:6px 0 0;color:#aebddb;font-weight:700;font-size:clamp(14px,2vw,18px);letter-spacing:.01em}

/* ---------- tools ---------- */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:36px 28px}
.grid{width:100%;max-width:1040px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{
  display:flex;flex-direction:column;gap:22px;padding:32px 32px 28px;min-height:230px;
  background:#fff;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--navy);box-shadow:0 18px 36px -18px rgba(14,33,71,.45)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ico{width:60px;height:60px;border-radius:15px;background:var(--tile);color:var(--navy);display:grid;place-items:center;transition:background .2s ease,color .2s ease}
.ico svg{width:34px;height:34px;display:block}
.card:hover .ico{background:var(--navy);color:#fff}
.txt h2{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.txt p{margin:0;color:var(--muted);font-weight:500;font-size:16px}
.open{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--navy);transition:gap .2s ease,color .2s ease}
.open svg{width:18px;height:18px}
.card:hover .open{gap:14px;color:var(--accent)}

footer{text-align:center;padding:0 20px 26px;color:var(--muted);font-weight:700;font-size:13px}

@media(max-width:760px){
  .bar{padding:16px 18px;gap:14px}
  .bar .gan{height:66px}
  main{align-items:flex-start;padding:22px 18px}
  .grid{grid-template-columns:1fr;gap:16px}
  .card{min-height:0;padding:24px 22px;gap:16px}
}
@media(prefers-reduced-motion:reduce){.card,.open,.ico{transition:none}.card:hover{transform:none}}
</style>
</head>

    url: "https://storage4myfile-max.github.io/cas-Redactor/",
    icon: `<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5h17l8 8v26H10z"/><path d="M27 5v8h8"/><path d="M16 21h12"/><rect x="15" y="28" width="14" height="4" rx="1" fill="currentColor"/></svg>`
  }
];

const arrow = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const grid = document.getElementById("grid");
TOOLS.forEach(t=>{
  const a = document.createElement("a");
  a.className = "card"; a.href = t.url; a.target = "_blank"; a.rel = "noopener";
