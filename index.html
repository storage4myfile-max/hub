<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VED Investment – Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12284c; --navy2:#1d3a6b; --ink:#16233a; --muted:#5b6b85;
  --bg:#eef2f8; --panel:#ffffff; --line:#d5deec; --accent:#0f8a7e; --accent-bg:#e3f4f1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--navy);color:#fff;padding:36px 20px 64px}
.wrap{max-width:860px;margin:0 auto}
header h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.01em}
header p{margin:6px 0 0;color:#b9c7e2;font-weight:500}
.search{margin-top:22px}
.search input{width:100%;padding:14px 16px;border-radius:10px;border:0;font:inherit;font-weight:500;background:#fff;color:var(--ink)}
.search input:focus{outline:3px solid #7fd3c9}
main{max-width:860px;margin:-34px auto 40px;padding:0 20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden}
section h2{margin:0;padding:14px 20px;font-size:15px;font-weight:800;color:var(--navy2);background:#f6f9fd;border-bottom:1px solid var(--line)}
.tool{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.tool:last-child{border-bottom:0}
.tool:hover{background:var(--accent-bg)}
.tool:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.ico{flex:none;width:44px;height:44px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:22px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;font-weight:800}
.txt span{display:block;color:var(--muted);font-size:14px;font-weight:500}
.go{flex:none;font-weight:800;font-size:14px;color:var(--accent);border:2px solid var(--accent);border-radius:8px;padding:6px 14px}
.tool:hover .go{background:var(--accent);color:#fff}
.empty{display:none;text-align:center;color:var(--muted);padding:30px;font-weight:700}
footer{max-width:860px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px;font-weight:700;text-align:center}
.add{padding:16px 20px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.add input{flex:1 1 150px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-weight:500}
.add button{padding:10px 18px;border:0;border-radius:8px;background:var(--navy);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.rm{flex:none;border:0;background:none;color:#a33;font-size:20px;cursor:pointer;padding:4px 8px}
@media(max-width:520px){.go{display:none}.tool{padding:14px 16px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>VED Investment Tools</h1>
    <p>Sahi Guidance, Sahi Balance</p>
    <div class="search"><input id="q" type="search" placeholder="Search a tool…" aria-label="Search tools" autocomplete="off"></div>
  </div>
</header>

<main id="main"></main>
<footer>VED Investment • Mutual Fund Distribution</footer>

<script>
/* ===== EDIT HERE: change any url to where the tool really lives ===== */
const GROUPS = [
  { name: "My tools", tools: [
    { icon:"📊", name:"MF Research Tool", desc:"NAV, SIP calculator, compare, holdings, TER, client report generator", url:"https://storage4myfile-max.github.io/mf-research-tool/" },
    { icon:"🔒", name:"CAS Redaction Engine", desc:"Remove personal details from CAS statements, single or batch", url:"https://storage4myfile-max.github.io/cas-Redactor/" }
  ]}
];
/* ==================================================================== */

const KEY = "ved_hub_custom_links";
function loadCustom(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ return []; } }
function saveCustom(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} }

const main = document.getElementById("main");
const q = document.getElementById("q");

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function toolRow(t, idx){
  const a = el("a","tool");
  a.href = t.url; a.target = "_blank"; a.rel = "noopener";
  a.dataset.search = (t.name+" "+t.desc).toLowerCase();
  a.innerHTML = `<div class="ico">${t.icon||"🔗"}</div><div class="txt"><b>${esc(t.name)}</b><span>${esc(t.desc||"")}</span></div><div class="go">Open</div>`;
  if(idx!==undefined){
    const rm = el("button","rm","×"); rm.title="Remove"; rm.setAttribute("aria-label","Remove "+t.name);
    rm.onclick = ev=>{ ev.preventDefault(); ev.stopPropagation(); const c=loadCustom(); c.splice(idx,1); saveCustom(c); render(); };
    a.appendChild(rm);
  }
  return a;
}

function render(){
  main.innerHTML = "";
  GROUPS.forEach(g=>{
    const s = el("section"); s.appendChild(el("h2","",esc(g.name)));
    g.tools.forEach(t=>s.appendChild(toolRow(t)));
    main.appendChild(s);
  });

  const custom = loadCustom();
  const s = el("section"); s.appendChild(el("h2","","My other links"));
  custom.forEach((t,i)=>s.appendChild(toolRow(t,i)));
  const form = el("div","add");
  form.innerHTML = `<input id="an" placeholder="Name" aria-label="Name"><input id="au" placeholder="Link (https://…)" aria-label="Link"><button id="ab">Add</button>`;
  s.appendChild(form);
  main.appendChild(s);
  form.querySelector("#ab").onclick = ()=>{
    const n = form.querySelector("#an").value.trim();
    let u = form.querySelector("#au").value.trim();
    if(!n||!u) return;
    if(!/^https?:\/\//i.test(u) && /\./.test(u) && !/\s/.test(u) && !/\.(html|xlsx|pdf)$/i.test(u)) u = "https://"+u;
    const c = loadCustom(); c.push({icon:"🔗",name:n,desc:u,url:u}); saveCustom(c); render();
  };

  const empty = el("div","empty","No tool matches your search."); empty.id="empty"; main.appendChild(empty);
  filter();
}

function filter(){
  const v = q.value.trim().toLowerCase();
  let shown = 0;
  main.querySelectorAll("section").forEach(sec=>{
    let any = false;
    sec.querySelectorAll(".tool").forEach(a=>{
      const ok = !v || a.dataset.search.includes(v);
      a.style.display = ok ? "" : "none";
      if(ok) any = true;
    });
    const isCustom = sec.querySelector(".add");
    sec.style.display = (any || (isCustom && !v)) ? "" : "none";
    if(any) shown++;
  });
  const e = document.getElementById("empty");
  if(e) e.style.display = (v && !shown) ? "block" : "none";
}
q.addEventListener("input", filter);
render();
</script>
</body>
</html>
