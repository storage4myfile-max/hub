<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VED Investment – Tools</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e2147;--ink:#101c36;--muted:#5b6b85;--line:#d9e1ee;--bg:#f5f7fb;--accent:#13a89a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}

header{background:var(--navy);color:#fff;text-align:center;padding:44px 20px 48px}
header svg{width:92px;height:92px;display:block;margin:0 auto 14px}
header h1{margin:0;font-size:clamp(26px,5vw,36px);font-weight:800;letter-spacing:-.01em}
header p{margin:6px 0 0;color:#aebddb;font-weight:700;font-size:16px}

main{max-width:880px;margin:0 auto;padding:44px 22px 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{
  display:flex;align-items:flex-start;gap:18px;padding:26px 26px;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  text-decoration:none;color:inherit;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.card:hover,.card:focus-visible{border-color:var(--navy);box-shadow:0 8px 24px -12px rgba(14,33,71,.35)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ico{flex:none;width:44px;height:44px;color:var(--navy)}
.ico svg{width:100%;height:100%;display:block}
.txt{flex:1;min-width:0}
.txt h2{margin:0 0 4px;font-size:19px;font-weight:800}
.txt p{margin:0 0 16px;color:var(--muted);font-weight:500;font-size:15px}
.open{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--navy);transition:gap .2s ease,color .2s ease}
.open svg{width:16px;height:16px}
.card:hover .open{gap:13px;color:var(--accent)}

footer{text-align:center;padding:26px 20px 44px;color:var(--muted);font-weight:700;font-size:13px}
@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding-top:30px}}
@media(prefers-reduced-motion:reduce){.card,.open{transition:none}}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shree Ganesh">
    <g fill="#0e2147" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="50" cy="104" rx="30" ry="42"/>
      <ellipse cx="150" cy="104" rx="30" ry="42"/>
      <ellipse cx="100" cy="100" rx="38" ry="42"/>
      <path d="M70 64 Q100 54 130 64 L118 32 Q100 4 82 32 Z"/>
      <path d="M76 50 Q100 42 124 50" stroke-width="3.5" fill="none"/>
      <path d="M100 68 V78" stroke-width="4"/>
      <path d="M100 98 C100 124 104 142 96 154 C90 163 78 160 80 151" fill="none" stroke-width="9"/>
      <path d="M116 128 C124 134 126 144 122 154" fill="none" stroke-width="4"/>
    </g>
    <circle cx="86" cy="94" r="4" fill="#fff"/>
    <circle cx="114" cy="94" r="4" fill="#fff"/>
  </svg>
  <h1>VED Investment</h1>
  <p>Sahi Guidance, Sahi Balance</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>VED Investment • Mutual Fund Distribution</footer>

<script>
/* ===== EDIT HERE to change a link or add a tool ===== */
const TOOLS = [
  {
    name: "MF Research Tool",
    desc: "NAV, SIP calculator, comparison, holdings, TER and client reports.",
    url: "https://storage4myfile-max.github.io/mf-research-tool/",
    icon: `<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v32h32"/><path d="M13 30V22M21 30V14M29 30V19M36 30V10" /><path d="M13 17l8-7 8 5 7-8" stroke-width="2"/></svg>`
  },
  {
    name: "CAS Redaction Engine",
    desc: "Hide personal details in CAS statements before sharing.",
    url: "https://storage4myfile-max.github.io/cas-Redactor/",
    icon: `<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5h17l8 8v26H10z"/><path d="M27 5v8h8"/><path d="M16 21h12" /><rect x="15" y="28" width="14" height="4" rx="1" fill="currentColor"/></svg>`
  }
];
/* ===================================================== */

const arrow = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const grid = document.getElementById("grid");
TOOLS.forEach(t=>{
  const a = document.createElement("a");
  a.className = "card"; a.href = t.url; a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = `<div class="ico">${t.icon}</div>
    <div class="txt"><h2>${t.name}</h2><p>${t.desc}</p><span class="open">Open ${arrow}</span></div>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
